<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recomp AI intro</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 32px; background: #FCFCFC; font-family: Inter, system-ui, sans-serif; }
  .logo { width: min(560px, 86vw); height: auto; overflow: visible; }
  /* The blue r assembles first (stem rises, shoulder joins), then "ecomp ai" comes out of it. */
  #stem { animation: rise 380ms cubic-bezier(.2,.8,.2,1) both; }
  #shoulder { animation: join 440ms 300ms cubic-bezier(.3,1.4,.5,1) both; }
  #wordmark { animation: name 520ms 720ms cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { transform: translateY(48px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes join { from { transform: translateX(56px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes name { from { transform: translateX(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #stem, #shoulder, #wordmark { animation: none; } }
  button { font: 500 14px Inter, system-ui, sans-serif; height: 40px; padding: 0 16px; border-radius: 10px;
           border: 1px solid #E2E8F0; background: #FFFFFF; color: #14141E; cursor: pointer; }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px #DCE6FF; }
</style>
</head>
